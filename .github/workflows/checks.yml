name: Check FenceCoach
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: node --check src/fencecoach/web/app.js
      - run: python -m unittest discover -s tests -v
      - run: python -m fencecoach.evaluation
      - run: docker build -t fencecoach:ci .
      - name: Exercise the container
        run: |
          docker run -d --name fencecoach-ci -p 127.0.0.1:8001:8000 fencecoach:ci
          trap 'docker rm -f fencecoach-ci' EXIT
          python scripts/container_smoke.py
