<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Deliberate fencing practice. Review your movement, understand your measurements, and know what to work on next."
    />
    <title>FenceCoach · Made for the piste</title>
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body class="piste">
    <a class="skip-link" href="#screen">Skip to content</a>
    <header class="app-header">
      <a class="wordmark" href="#train" aria-label="FenceCoach home"
        ><img src="/static/mark.svg" alt="" />FENCECOACH<span
          >MADE FOR THE PISTE</span
        ></a
      >
      <nav id="desktop-nav" aria-label="Main navigation"></nav>
      <button
        class="profile-avatar"
        data-go="settings"
        aria-label="Practice settings"
      >
        FC
      </button>
    </header>
    <div id="notice" class="notice" role="alert" hidden></div>
    <main id="screen" tabindex="-1">
      <div class="loading-state">
        <span class="eyebrow">FENCECOACH</span>
        <h1>Getting your training space ready.</h1>
        <p>Loading your saved sessions…</p>
      </div>
    </main>
    <nav class="app-nav" id="mobile-nav" aria-label="App navigation"></nav>
    <footer class="app-footer">
      <span>SMALL SESSIONS. CONSISTENT WORK.</span
      ><span>FENCECOACH / FOIL</span>
    </footer>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="import-dialog" aria-labelledby="import-title"></dialog>
    <dialog id="evidence-dialog" aria-labelledby="evidence-title"></dialog>
    <noscript
      ><p class="notice">
        FenceCoach needs JavaScript to open sessions and coaching reports.
      </p></noscript
    >
  </body>
</html>
